name: Build and Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: release-master
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  linux:
    name: Linux x86-64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++ \
            make \
            libsfml-dev \
            curl \
            file \
            patchelf \
            imagemagick \
            xvfb \
            xauth

      - name: Compilar
        run: |
          make clean
          make -j"$(nproc)"

      - name: Testar
        run: |
          make test-logica
          ALSOFT_DRIVERS=null xvfb-run -a make -j4 test-integracao

      - name: Montar AppDir
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/zombies

          cp prog AppDir/usr/bin/zombies
          cp -r Design AppDir/usr/share/zombies/Design
          rm -rf AppDir/usr/share/zombies/Design/imagens/legacy

          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh

          APPDIR="$(dirname "$(readlink -f "$0")")"

          export ZOMBIES_RECURSOS="$APPDIR/usr/share/zombies"

          exec "$APPDIR/usr/bin/zombies" "$@"
          EOF

          chmod +x AppDir/AppRun

          cat > AppDir/zombies.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Zombies++
          Exec=zombies
          Icon=zombies
          Categories=Game;
          Terminal=false
          EOF

          # O linuxdeploy exige um ícone quadrado em resolução válida.
          convert Design/imagens/zumbi_bateu_morreu.png \
            -thumbnail 224x224 \
            -background none \
            -gravity center \
            -extent 256x256 \
            AppDir/zombies.png

      - name: Baixar linuxdeploy
        run: |
          curl --fail --location --retry 3 \
            -o linuxdeploy.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage

          chmod +x linuxdeploy.AppImage

      - name: Incluir bibliotecas
        run: |
          APPIMAGE_EXTRACT_AND_RUN=1 ./linuxdeploy.AppImage \
            --appdir AppDir \
            --executable AppDir/usr/bin/zombies \
            --desktop-file AppDir/zombies.desktop \
            --icon-file AppDir/zombies.png

      - name: Baixar appimagetool
        run: |
          curl --fail --location --retry 3 \
            -o appimagetool.AppImage \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage

          chmod +x appimagetool.AppImage

      - name: Gerar AppImage
        run: |
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 \
            ./appimagetool.AppImage \
            AppDir \
            Zombies++-Linux-x86_64.AppImage

      - name: Salvar build Linux
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: Zombies++-Linux-x86_64.AppImage
          if-no-files-found: error


  windows:
    name: Windows x86-64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            mingw-w64-x86_64-nsis
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Compilar SFML 2.6.2
        shell: msys2 {0}
        run: |
          git clone \
            --depth 1 \
            --branch 2.6.2 \
            https://github.com/SFML/SFML.git \
            SFML-src

          cmake \
            -S SFML-src \
            -B SFML-build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DSFML_BUILD_EXAMPLES=OFF \
            -DSFML_BUILD_DOC=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/SFML-local"

          cmake --build SFML-build --parallel 4
          cmake --install SFML-build

      - name: Compilar Zombies++
        shell: msys2 {0}
        run: |
          export PATH="$PWD/SFML-local/bin:$PATH"

          make clean

          make -j4 \
            SFML_ROOT="$PWD/SFML-local"

      - name: Montar pacote Windows
        shell: msys2 {0}
        run: |
          export PATH="$PWD/SFML-local/bin:$PATH"

          mkdir -p dist/Zombies++

          cp prog.exe \
            dist/Zombies++/Zombies++.exe

          cp -r Design \
            dist/Zombies++/Design

          rm -rf dist/Zombies++/Design/imagens/legacy

          # DLLs da SFML 2.6.2 compilada pelo workflow.
          cp -n SFML-local/bin/*.dll \
            dist/Zombies++/

          # Dependências extras distribuídas pela própria SFML,
          # como OpenAL, caso estejam presentes.
          if [ -d SFML-src/extlibs/bin/x64 ]; then
            cp -n \
              SFML-src/extlibs/bin/x64/*.dll \
              dist/Zombies++/ \
              2>/dev/null || true
          fi

          # Runtime do MinGW necessário para rodar o .exe
          # em uma máquina Windows sem MSYS2 instalado.
          ldd prog.exe \
            | awk '/=> \/mingw64\// {print $3}' \
            | sort -u \
            | while read -r dll; do

                if [ -f "$dll" ]; then
                  cp -n "$dll" \
                    dist/Zombies++/ || true
                fi

              done

          # Um unico download; recursos e DLLs sao instalados junto ao jogo.
          cat > installer.nsi <<'EOF'
          Unicode true
          Name "Zombies++"
          OutFile "Zombies++-Windows-x86_64-Setup.exe"
          InstallDir "$LOCALAPPDATA\Programs\Zombies++"
          RequestExecutionLevel user
          SetCompressor /SOLID lzma
          Page directory
          Page instfiles
          Section "Jogo"
            SetOutPath "$INSTDIR"
            File /r "dist\Zombies++\*.*"
            CreateDirectory "$SMPROGRAMS\Zombies++"
            CreateShortcut "$SMPROGRAMS\Zombies++\Zombies++.lnk" "$INSTDIR\Zombies++.exe"
          SectionEnd
          EOF
          makensis installer.nsi

      - name: Salvar build Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Zombies++-Windows-x86_64-Setup.exe
          if-no-files-found: error


  release:
    name: Criar nova versão
    permissions:
      contents: write

    needs:
      - linux
      - windows

    runs-on: ubuntu-latest

    steps:
      - name: Checkout com histórico e tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baixar builds
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Calcular versão, criar tag e publicar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        shell: bash

        run: |
          git fetch --tags origin

          publicou=false
          for tentativa in 1 2 3; do

            LATEST="$(
              git tag \
                -l 'v[0-9]*.[0-9]*.[0-9]*' \
                --sort=-v:refname \
              | head -n 1
            )"

            if [ -z "$LATEST" ]; then

              MAJOR=1
              MINOR=0
              PATCH=0

            else

              VERSION="${LATEST#v}"

              IFS='.' read -r \
                MAJOR \
                MINOR \
                PATCH \
                <<< "$VERSION"

              PATCH=$((PATCH + 1))

            fi

            TAG="v${MAJOR}.${MINOR}.${PATCH}"

            echo "Tentando criar ${TAG}..."

            git tag "$TAG" "$GITHUB_SHA"

            if git push origin "$TAG"; then
              publicou=true
              break
            fi

            echo "A tag ${TAG} já existe. Recalculando..."

            git tag -d "$TAG" || true
            git fetch --tags origin

            sleep 2

          done

          if [ "$publicou" != true ]; then
            echo "Falha ao publicar a tag apos tres tentativas." >&2
            exit 1
          fi
          echo "Nova versão: $TAG"

          mv \
            dist/Zombies++-Linux-x86_64.AppImage \
            "dist/Zombies++-${TAG}-Linux-x86_64.AppImage"

          mv \
            dist/Zombies++-Windows-x86_64-Setup.exe \
            "dist/Zombies++-${TAG}-Windows-x86_64-Setup.exe"

          gh release create "$TAG" \
            "dist/Zombies++-${TAG}-Linux-x86_64.AppImage" \
            "dist/Zombies++-${TAG}-Windows-x86_64-Setup.exe" \
            --title "Zombies++ $TAG" \
            --generate-notes \
            --notes "Linux: baixe o AppImage, permita sua execucao e abra. Windows: execute o Setup.exe para instalar o jogo com seus recursos e bibliotecas. Os arquivos Source code sao adicionados automaticamente pelo GitHub." \
            --latest
